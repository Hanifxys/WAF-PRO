apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wafapplications.wafpro.io
spec:
  group: wafpro.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                hostname:
                  type: string
                upstream:
                  type: object
                  properties:
                    service:
                      type: string
                    port:
                      type: integer
                wafPolicy:
                  type: object
                  properties:
                    ref:
                      type: string
  scope: Namespaced
  names:
    plural: wafapplications
    singular: wafapplication
    kind: WAFApplication
    shortNames:
      - wa
