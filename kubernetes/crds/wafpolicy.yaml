apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wafpolicies.wafpro.io
spec:
  group: wafpro.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mode:
                  type: string
                  enum: [block, log, off]
                rules:
                  type: object
                  properties:
                    managed:
                      type: array
                      items:
                        type: string
                rateLimit:
                  type: object
                  properties:
                    requests:
                      type: integer
                    window:
                      type: string
                bot:
                  type: object
                  properties:
                    enabled:
                      type: boolean
  scope: Namespaced
  names:
    plural: wafpolicies
    singular: wafpolicy
    kind: WAFPolicy
    shortNames:
      - wp
