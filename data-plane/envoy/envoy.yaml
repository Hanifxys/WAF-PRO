node:
  cluster: waf_cluster
  id: waf_node_1

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          type: "access_log"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          response_code: "%RESPONSE_CODE%"

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      response_headers_to_add:
                        - header:
                            key: Strict-Transport-Security
                            value: "max-age=31536000; includeSubDomains; preload"
                          keep_empty_value: false
                        - header:
                            key: X-Content-Type-Options
                            value: "nosniff"
                        - header:
                            key: X-Frame-Options
                            value: "SAMEORIGIN"
                        - header:
                            key: Referrer-Policy
                            value: "strict-origin-when-cross-origin"
                        - header:
                            key: Permissions-Policy
                            value: "geolocation=(), microphone=(), camera=()"
                        - header:
                            key: X-WAF-Protection
                            value: "WAF-Pro-SaaS/1.0 active"
                        - header:
                            key: X-XSS-Protection
                            value: "1; mode=block"
                      response_headers_to_remove:
                        - Server
                        - X-Powered-By
                      routes:
                        - match:
                            prefix: "/.waf-challenge/"
                          route:
                            cluster: management_api
                            prefix_rewrite: "/api/v1/bot-challenge/"
                        - match:
                            prefix: "/api/login"
                          route:
                            cluster: origin_mock
                            rate_limits:
                              - actions:
                                  - request_headers:
                                      header_name: ":path"
                                      descriptor_key: "request_path"
                                  - remote_address: {}
                              - actions:
                                  - request_headers:
                                      header_name: "X-Login-Username"
                                      descriptor_key: "login_username"
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: http_local_rate_limiter_login
                              token_bucket:
                                max_tokens: 5
                                tokens_per_fill: 5
                                fill_interval: 2s
                              filter_enabled:
                                runtime_key: local_rate_limit_enabled
                                default_value:
                                  numerator: 100
                                  denominator: HUNDRED
                              filter_enforced:
                                runtime_key: local_rate_limit_enforced
                                default_value:
                                  numerator: 100
                                  denominator: HUNDRED
                              response_headers_to_add:
                                - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                  header:
                                    key: x-local-rate-limit
                                    value: 'true'
                        - match:
                            prefix: "/api/search"
                          route:
                            cluster: origin_mock
                            rate_limits:
                              - actions:
                                  - request_headers:
                                      header_name: "X-User-Class"
                                      descriptor_key: "user_class"
                        - match:
                            prefix: "/"
                          route:
                            cluster: podomoro_origin
                            host_rewrite_literal: "podomoro-timer-flame.vercel.app"
                http_filters:
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: waf_global
                      failure_mode_deny: false
                      rate_limit_service:
                        grpc_service:
                          envoy_grpc:
                            cluster_name: rate_limit_service
                          timeout: 0.25s
                        transport_api_version: V3
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter_global
                      token_bucket:
                        max_tokens: 1000
                        tokens_per_fill: 1000
                        fill_interval: 60s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                  - name: coraza-wasm-config
                    config_discovery:
                      config_source:
                        api_config_source:
                          api_type: GRPC
                          transport_api_version: V3
                          grpc_services:
                            - envoy_grpc:
                                cluster_name: xds_cluster
                      type_urls:
                        - type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      default_config:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                        config:
                          name: "coraza-filter-default"
                          vm_config:
                            runtime: "envoy.wasm.runtime.v8"
                            vm_id: "coraza-waf-default"
                            code:
                              local:
                                filename: "/shared/coraza-proxy-wasm.wasm"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: xds_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      http2_protocol_options: {}
      load_assignment:
        cluster_name: xds_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: management-api
                      port_value: 18000
    - name: rate_limit_service
      connect_timeout: 0.25s
      type: STRICT_DNS
      http2_protocol_options: {}
      load_assignment:
        cluster_name: rate_limit_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ratelimit
                      port_value: 8081
    - name: management_api
      connect_timeout: 0.25s
      type: STRICT_DNS
      load_assignment:
        cluster_name: management_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: management-api
                      port_value: 8082
    - name: origin_mock
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: origin_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: origin-mock
                      port_value: 8081
    - name: podomoro_origin
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: podomoro_origin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: podomoro-timer-flame.vercel.app
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: podomoro-timer-flame.vercel.app
