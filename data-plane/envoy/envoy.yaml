node:
  cluster: waf_cluster
  id: waf_node_1

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                generate_request_id: true
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      response_headers_to_add:
                        - header:
                            key: Strict-Transport-Security
                            value: "max-age=31536000; includeSubDomains; preload"
                          keep_empty_value: false
                        - header:
                            key: X-Content-Type-Options
                            value: "nosniff"
                        - header:
                            key: X-Frame-Options
                            value: "SAMEORIGIN"
                        - header:
                            key: Referrer-Policy
                            value: "strict-origin-when-cross-origin"
                        - header:
                            key: Permissions-Policy
                            value: "geolocation=(), microphone=(), camera=()"
                        - header:
                            key: X-WAF-Protection
                            value: "WAF-Pro-SaaS/1.0 active"
                        - header:
                            key: X-XSS-Protection
                            value: "1; mode=block"
                      response_headers_to_remove:
                        - Server
                        - X-Powered-By
                      routes:
                        - match:
                            prefix: "/api/login"
                          route:
                            cluster: origin_mock
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: http_local_rate_limiter_login
                              token_bucket:
                                max_tokens: 5
                                tokens_per_fill: 5
                                fill_interval: 2s
                              filter_enabled:
                                runtime_key: local_rate_limit_enabled
                                default_value:
                                  numerator: 100
                                  denominator: HUNDRED
                              filter_enforced:
                                runtime_key: local_rate_limit_enforced
                                default_value:
                                  numerator: 100
                                  denominator: HUNDRED
                              response_headers_to_add:
                                - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                  header:
                                    key: x-local-rate-limit
                                    value: 'true'
                        - match:
                            prefix: "/"
                          route:
                            cluster: origin_mock
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter_global
                      token_bucket:
                        max_tokens: 1000
                        tokens_per_fill: 1000
                        fill_interval: 60s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                  - name: coraza-wasm-config
                    config_discovery:
                      config_source:
                        api_config_source:
                          api_type: GRPC
                          transport_api_version: V3
                          grpc_services:
                            - envoy_grpc:
                                cluster_name: xds_cluster
                      type_urls:
                        - type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      default_config:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                        config:
                          name: "coraza-filter-default"
                          vm_config:
                            runtime: "envoy.wasm.runtime.v8"
                            vm_id: "coraza-waf-default"
                            code:
                              local:
                                filename: "/shared/coraza-proxy-wasm.wasm"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: xds_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      http2_protocol_options: {}
      load_assignment:
        cluster_name: xds_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: management-api
                      port_value: 18000
    - name: origin_mock
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: origin_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: origin-mock
                      port_value: 8081
